name: Bug report
description: Something went wrong, such as a crash, wrong analysis, broken mocks, or tests that should have passed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please remove secrets (API keys, tokens, passwords) from anything you paste.
  - type: input
    id: version
    attributes:
      label: Assertloom version
      description: Output of `npx assertloom --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
      placeholder: Node 24.11.1, Windows 11
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: npx assertloom generate src/cart.ts --model gpt-5.4-mini
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full terminal output. A `--report` JSON file helps for generate and repair problems.
      render: text
  - type: textarea
    id: source
    attributes:
      label: Minimal source file
      description: The smallest source file that reproduces the problem, if you can share one.
      render: typescript
