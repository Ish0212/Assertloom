name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          # The GitHub Action installs this exact npm version; it must match the release it is tagged with.
          action_version=$(awk '/^  assertloom-version:/ {found=1} found && /default:/ {gsub(/[" ]/, "", $2); print $2; exit}' action.yml)
          if [ "$action_version" != "$version" ]; then
            echo "action.yml installs assertloom@$action_version, but this release is $version. Update assertloom-version in action.yml." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # npm uses trusted publishing (OIDC, configured on npmjs.com; needs npm 11.5.1 or later) when it is set up
      # for this package, and otherwise the NPM_TOKEN secret: a granular token limited to publishing assertloom.
      - run: npm install -g npm@11
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
